name: Deploy to GitHub Pages

# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions" 로 설정해야 합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # base_url(예: https://user.github.io/repo) / base_path(예: /repo, 커스텀 도메인이면 빈 값)
      - id: pages
        uses: actions/configure-pages@v6

      - name: Set site env
        run: |
          echo "SITE_ENV=production" >> "$GITHUB_ENV"
          echo "PAGES_DEPLOY=1" >> "$GITHUB_ENV"
          echo "SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "SITE_LASTMOD=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}" >> "$GITHUB_ENV"

      - name: Install (package-lock.json 있으면 npm ci로 고정 설치)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else echo "::warning::package-lock.json 없음 — npm install로 설치합니다. lockfile.yml을 실행해 lockfile을 커밋하세요."; npm install --no-audit --no-fund; fi

      - name: Install Chromium for route tests
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build (guard → next build → .nojekyll/CNAME)
        run: npm run build

      - name: SEO audit
        run: npm run seo

      - name: Route / mobile tests (GitHub Pages rules, basePath)
        run: npm run test:routes

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-reports
          path: |
            reports/*.json
            reports/screenshots/
            package-lock.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
      - name: Set site env
        run: |
          echo "SITE_ENV=production" >> "$GITHUB_ENV"
          echo "SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Verify public URL (pages, CSS, images, links, sitemap, robots, canonical)
        run: npm run verify:live -- "${{ needs.deploy.outputs.page_url }}"
      # 모바일 Lighthouse (실험실 측정, 실패해도 배포 결과에는 영향 없음)
      - name: Lighthouse mobile (home, reservation)
        continue-on-error: true
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          for P in "" "reservation/"; do
            L=$([ -z "$P" ] && echo home || echo reservation)
            npx --yes lighthouse@12 "${URL}${P}" --quiet --form-factor=mobile --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh-$L.json" || true
            node scripts/lighthouse-summary.mjs "$L" "lh-$L.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-verify
          path: reports/live-verify.json
