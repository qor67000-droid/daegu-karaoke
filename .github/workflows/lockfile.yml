name: Generate package-lock.json

# 저장소에 package-lock.json이 없거나 package.json을 바꿨을 때 수동 실행(Actions 탭 → Run workflow).
# 실제 npm 레지스트리에서 의존성을 해석해 lockfile을 만들고, 빌드가 통과하면 main에 커밋한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund
      - name: Build check with the new lockfile (preview mode)
        env:
          SITE_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build
          npm run seo
      - name: Commit package-lock.json
        run: |
          if git diff --quiet --exit-code -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated by lockfile.yml)"
          git push
